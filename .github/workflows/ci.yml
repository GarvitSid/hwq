name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Type check with mypy
        run: python -m mypy src

      - name: Run security audit
        run: python -m pytest tests/test_security_audit_m8.py -q

      - name: Run pytest (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q -x

      - name: Run pytest (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest -q -x -m "not linux"

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Record live hardware snapshot
        run: python -m hwq.snapshot --out live-snapshot-ubuntu

      - name: Verify recorded snapshot schema
        run: |
          python -c "import json; idx = json.load(open('live-snapshot-ubuntu/index.json')); assert idx.get('schema') == 1 or idx.get('schema_version') == 1, 'Invalid schema'"

      - name: Upload snapshot fixture artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-live-snapshot
          path: live-snapshot-ubuntu/
          retention-days: 7
